name: neurofold

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/backend/src:ro
      - biological-archive:/app/data/archive
    environment:
      NEUROFOLD_ARCHIVE_ROOT: /app/data/archive
      NEUROFOLD_WORKERS: ${NEUROFOLD_WORKERS:-4}
      NEUROFOLD_OPERATION_SECONDS: ${NEUROFOLD_OPERATION_SECONDS:-90}
    command:
      - uvicorn
      - neurofold.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/backend/src
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: [python, -m, neurofold.worker]
    init: true
    environment:
      NEUROFOLD_ARCHIVE_ROOT: /app/data/archive
    volumes:
      - biological-archive:/app/data/archive
    stop_grace_period: 10s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./frontend/index.html:/app/frontend/index.html:ro
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  biological-archive:
