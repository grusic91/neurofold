[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "neurofold"
version = "0.1.0"
description = "Protein structure prediction and neurodegenerative disease research platform"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "jsonschema>=4.23,<5",
    "mypy>=1.14,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pytest-socket>=0.7,<1",
    "ruff>=0.9,<1",
    "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neurofold"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket --cov=neurofold --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["^\\s*\\.\\.\\.$"]
